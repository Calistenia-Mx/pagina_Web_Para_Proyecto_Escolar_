<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIVY STREET | Productos Mujer</title>
    <!-- Reutilizamos los estilos del index para consistencia -->
    <link rel="stylesheet" href="estiloss.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>
    <style>
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 40px 8%;
        }
        .header-mujer {
            background: #000;
            color: #fff;
            padding: 100px 8% 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">KIVY<span>STREET</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="acercadenosotros.html">Nosotros</a></li>
            <li class="dropdown">
                <a href="index.html#productos" id="coleccion-link">Colección</a>
                <ul class="dropdown-menu" id="coleccion-menu">
                    <li><a href="index.html#productos">Productos Hombre</a></li>
                    <li><a href="productosMujer.html">Productos Mujer</a></li>
                    <li><a href="index.html#productos">Productos Joven</a></li>
                </ul>
            </li>
        </ul>
        <div class="nav-icons">
            <div class="user-menu-container">
                <div id="user-icon" class="user-icon" title="Usuario"><i class="fas fa-user"></i></div>
                <div id="user-dropdown" class="user-dropdown">
                    <a href="#" class="dropdown-item" onclick="showLoginModal()">Iniciar Sesión</a>
                    <a href="#" class="dropdown-item" onclick="showRegisterModal()">Crear Cuenta</a>
                </div>
            </div>
            <div id="cart-icon" class="cart-icon">
                <i class="fas fa-shopping-cart"></i>
                <small id="cart-count">0</small>
            </div>
        </div>
    </nav>

    <div class="header-mujer">
        <h1 class="section-title" style="color: white;">COLECCIÓN MUJER</h1>
        <p>Diseños exclusivos para ellas.</p>
    </div>

    <!-- Filtros -->
    <div class="filtros-container" style="display: flex; justify-content: center; gap: 20px; padding: 20px;">
        <input type="text" id="busqueda" class="filtro-input" placeholder="🔍 Buscar..." style="padding: 10px; border-radius: 20px; border: 1px solid #ccc;">
    </div>

    <div class="productos-grid" id="productos-mujer-grid">
        <!-- Se cargará dinámicamente -->
    </div>

    <!-- Carrito Sidebar -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Tu Carrito</h2>
            <button id="close-cart">×</button>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
            <div class="total-container">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>
            <div id="paypal-button-container"></div>
        </div>
    </div>

    <!-- Modales -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <div class="logo">KIVY<span>STREET</span></div>
            <h2>LOGIN</h2>
            <form id="login-form">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Pass" required>
                <button type="submit" class="checkout-btn">ENTRAR</button>
            </form>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="register-content modal-content">
            <div class="logo">KIVY<span>STREET</span></div>
            <h2>REGISTRO</h2>
            <form id="register-form">
                <input type="text" name="nombre" placeholder="Nombre" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Pass" required>
                <input type="password" name="confirm_password" placeholder="Confirmar" required>
                <button type="submit" class="checkout-btn">CREAR CUENTA</button>
            </form>
        </div>
    </div>

    <script src="core.js"></script>
    <script>
        let productosMujer = [];
        async function loadMujerProducts() {
            const res = await fetch('obtener_productos.php?categoria=Mujer');
            productosMujer = await res.json();
            const grid = document.getElementById('productos-mujer-grid');
            grid.innerHTML = '';
            productosMujer.forEach((p, i) => {
                grid.innerHTML += `
                    <div class="card fade-in-scale" style="animation-delay: ${i*0.1}s">
                        <div class="card-img-container">
                            <img src="${p.imagen}" alt="${p.nombre}" onclick="showQuickViewMejorado(${p.id})">
                        </div>
                        <h3>${p.nombre}</h3>
                        <p class="product-price">$${parseFloat(p.precio).toFixed(2)}</p>
                        <div class="card-buttons">
                            <button class="add-btn" onclick="addToCart(${p.id}, productosMujer)"> <i class="fas fa-shopping-bag"></i> Añadir</button>
                        </div>
                    </div>
                `;
            });
        }
        document.addEventListener('DOMContentLoaded', loadMujerProducts);
    </script>
</body>
</html>
